name: C4-07B3B3B3A Dual-Signed DLQ Review Journal
on:
  pull_request:
    paths:
      - 'packages/identity/**'
      - '.github/workflows/c4-07b3b3b3a-review-journal.yml'
  push:
    branches: [main]
    paths:
      - 'packages/identity/**'
      - '.github/workflows/c4-07b3b3b3a-review-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-review-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: mautic_ci
          MARIADB_USER: mautic_ci
          MARIADB_PASSWORD: ci-only-mautic-password
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      COMPOSER_MEMORY_LIMIT: '-1'
      MOS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mautic_ci;charset=utf8mb4
      MOS_TEST_DB_USER: mautic_ci
      MOS_TEST_DB_PASSWORD: ci-only-mautic-password
      MOS_QUEUE_MODE: OFF
      MOS_REVIEW_RECORD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, intl, mbstring, mysqli, pdo_mysql, sodium, xml, zip
          coverage: none
      - name: Install pinned dependencies
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction --no-ansi
      - name: PHP syntax and domain test regression
        run: |
          php -l packages/identity/src/Runtime/MosDLQReviewJournal.php
          php -l packages/identity/bin/dlq_record_dual_review.php
          php -l packages/identity/tests/c4_07b3b3b3a_review_journal.php
          php -r 'if(!function_exists("sodium_crypto_sign_verify_detached")) exit(1);'
          php packages/contracts/tests/run.php
          php packages/identity/tests/run.php
      - name: Real MariaDB signed archive review and journal adversarial acceptance
        run: php packages/identity/tests/c4_07b3b3b3a_review_journal.php
      - name: Confirm consent/sends and review feature remain OFF by default
        run: |
          test "$MOS_QUEUE_MODE" = 'OFF'
          test "$MOS_REVIEW_RECORD_ENABLED" = '0'
