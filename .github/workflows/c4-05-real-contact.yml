name: C4-05 Real Mautic Contact Shadow Import
on:
  pull_request:
    paths:
      - 'packages/identity/**'
      - '.github/workflows/c4-05-real-contact.yml'
  push:
    branches: [main]
    paths:
      - 'packages/identity/**'
      - '.github/workflows/c4-05-real-contact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mautic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: mautic_ci
          MARIADB_USER: mautic_ci
          MARIADB_PASSWORD: ci-only-mautic-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      COMPOSER_MEMORY_LIMIT: "-1"
      APP_ENV: prod
      APP_DEBUG: "0"
      MOS_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=mautic_ci;charset=utf8mb4"
      MOS_TEST_DB_USER: mautic_ci
      MOS_TEST_DB_PASSWORD: ci-only-mautic-password
      MOS_SNAPSHOT_HMAC_KEY: ci-only-snapshot-secret-32bytes-or-more-do-not-use-in-prod
      MOS_BRIDGE_MODE: SHADOW
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, imap, intl, mbstring, mysqli, pdo_mysql, sodium, xml, zip
          ini-values: memory_limit=2G, max_execution_time=600
          coverage: none
      - name: Install pinned Mautic vendor dependencies
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction --no-ansi
      - name: Install Mautic 7.2.1 on ephemeral MariaDB
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_PASS="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$ADMIN_PASS"
          php bin/console mautic:install 'http://127.0.0.1' --force --no-interaction \
            --db_driver=pdo_mysql --db_host=127.0.0.1 --db_port=3306 \
            --db_name=mautic_ci --db_user=mautic_ci --db_password=ci-only-mautic-password \
            --db_backup_tables=false --admin_firstname=Test --admin_lastname=Operator \
            --admin_username=ci_admin --admin_email=ci-admin@example.invalid --admin_password="$ADMIN_PASS"
      - name: PHP syntax + Canonical contracts
        run: |
          find packages/identity/src/Bridge packages/identity/tests/c4_05_real_mautic.php packages/identity/tests/c4_05b_reconcile.php packages/identity/tests/c4_05b_leadmodel_probe.php packages/identity/tests/c4_05c_scheduled_worker.php packages/identity/tests/c4_05c_crash_worker.php packages/identity/tests/c4_06_source_audit.php packages/identity/bin/audit_mautic_source.php packages/identity/bin/import_mautic_contact.php packages/identity/bin/run_scheduled_shadow_scan.php packages/identity/bin/reconcile_mautic_contacts.php -name '*.php' -print0 | xargs -0 -n1 php -l
          php packages/contracts/tests/run.php
      - name: Verify upstream mandatory Contact columns
        run: |
          php -r '$db=new PDO(getenv("MOS_TEST_DSN"),getenv("MOS_TEST_DB_USER"),getenv("MOS_TEST_DB_PASSWORD")); $s=$db->query("SELECT COLUMN_NAME,COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=\x27leads\x27 AND IS_NULLABLE=\x27NO\x27 AND COLUMN_DEFAULT IS NULL AND EXTRA NOT LIKE \x27%auto_increment%\x27 ORDER BY ORDINAL_POSITION"); foreach($s as $r)echo $r[0]." ".$r[1]."\n";'
      - name: Run actual Mautic leads DB snapshot and MOS import tests
        run: php packages/identity/tests/c4_05_real_mautic.php
      - name: C4-05B committed-source sweep and delayed-commit recovery
        run: php packages/identity/tests/c4_05b_reconcile.php
      - name: C4-05B actual LeadModel post-save transaction probe
        run: php packages/identity/tests/c4_05b_leadmodel_probe.php
      - name: C4-05C bounded worker, hard-crash recovery and CLI gating
        run: php packages/identity/tests/c4_05c_scheduled_worker.php
      - name: C4-06 source change, disappearance and legacy-evidence audit suite
        run: php packages/identity/tests/c4_06_source_audit.php
      - name: C4-06 audit CLI disabled by default, signals review without leaking PII
        shell: bash
        run: |
          set -euo pipefail
          WS="$(php -r '$db=new PDO(getenv("MOS_TEST_DSN"),getenv("MOS_TEST_DB_USER"),getenv("MOS_TEST_DB_PASSWORD"));echo $db->query("SELECT workspace_id FROM mos_source_reconciliation_case WHERE status=\x27SOURCE_CHANGED\x27 LIMIT 1")->fetchColumn();')"
          test -n "$WS"
          if MOS_SOURCE_AUDIT_ENABLED=0 php packages/identity/bin/audit_mautic_source.php "$WS" 0 500 > /tmp/c406-disabled.out 2>&1; then
            echo "FAIL: source audit ran while disabled"; exit 1
          fi
          test ! -s /tmp/c406-disabled.out || grep -q 'refused' /tmp/c406-disabled.out
          set +e
          MOS_SOURCE_AUDIT_ENABLED=1 php packages/identity/bin/audit_mautic_source.php "$WS" 0 500 > /tmp/c406-enabled.json 2>/tmp/c406-enabled.err
          status="$?"
          set -e
          test "$status" -eq 2
          test ! -s /tmp/c406-enabled.err
          php -r '$x=json_decode(file_get_contents("/tmp/c406-enabled.json"),true,512,JSON_THROW_ON_ERROR);if(!$x["review_required"]||$x["seen"]<1||!isset($x["status_counts"]["SOURCE_CHANGED"]))exit(1);'
          if grep -Eiq '@example.invalid|ci-only-snapshot-secret|Changed|OneMoreChange' /tmp/c406-enabled.json; then
            echo "FAIL: PII or secret leaked in source audit"; exit 1
          fi
      - name: Confirm default-off CLI blocks importing
        shell: bash
        run: |
          set -euo pipefail
          if MOS_BRIDGE_MODE=OFF php packages/identity/bin/import_mautic_contact.php invalid 1 > /tmp/mos-output 2>&1; then
            echo "SECURITY FAILURE: CLI ran while disabled"; exit 1
          fi
          grep -q 'blocked' /tmp/mos-output
          if grep -Eiq 'fixture-.*@example.invalid|ci-only-snapshot-secret' /tmp/mos-output; then
            echo "SECURITY FAILURE: leaked PII/secret";exit 1
          fi
