name: C4-08B Bounded Mautic Scan to Durable Inbox
on:
  pull_request:
    paths:
      - 'packages/identity/bin/run_shadow_pipeline.php'
      - 'packages/identity/tests/c4_08b_**'
      - 'packages/identity/tests/c4_07b3b3a_**'
      - 'packages/identity/bin/run_credentialed_shadow_cycle.php'
      - 'packages/identity/src/Runtime/MosDatabaseRestoreAttestor.php'
      - 'packages/identity/tests/c4_07b3b3b2_**'
      - 'packages/identity/src/Runtime/MosCredentialDirectory.php'
      - 'deploy/systemd/**'
      - '.github/workflows/c4-08b-bounded-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'packages/identity/bin/run_shadow_pipeline.php'
      - 'packages/identity/tests/c4_08b_**'
      - 'packages/identity/tests/c4_07b3b3a_**'
      - 'packages/identity/bin/run_credentialed_shadow_cycle.php'
      - 'packages/identity/src/Runtime/MosDatabaseRestoreAttestor.php'
      - 'packages/identity/tests/c4_07b3b3b2_**'
      - 'packages/identity/src/Runtime/MosCredentialDirectory.php'
      - 'deploy/systemd/**'
      - '.github/workflows/c4-08b-bounded-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: mautic_ci
          MARIADB_USER: mautic_ci
          MARIADB_PASSWORD: ci-only-mautic-password
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      COMPOSER_MEMORY_LIMIT: '-1'
      MOS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mautic_ci;charset=utf8mb4
      MOS_TEST_DB_USER: mautic_ci
      MOS_TEST_DB_PASSWORD: ci-only-mautic-password
      MOS_SNAPSHOT_HMAC_KEY: ci-only-hmac-secret-longer-than-32-bytes-not-production
      MOS_BRIDGE_MODE: 'OFF'
      MOS_QUEUE_ENABLED: '0'
      MOS_QUEUE_MODE: 'OFF'
      MOS_SUPERVISOR_ENABLED: '0'
      MOS_SCHEDULED_SHADOW_ENABLED: '0'
      MOS_PIPELINE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, imap, intl, mbstring, mysqli, pdo_mysql, sodium, xml, zip
          ini-values: memory_limit=2G, max_execution_time=600
          coverage: none
      - name: Install pinned Mautic vendor dependencies
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction --no-ansi
      - name: Install pinned Mautic 7.2.1 into disposable MariaDB
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_PASS="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$ADMIN_PASS"
          php bin/console mautic:install 'http://127.0.0.1' --force --no-interaction \
            --db_driver=pdo_mysql --db_host=127.0.0.1 --db_port=3306 \
            --db_name=mautic_ci --db_user=mautic_ci --db_password=ci-only-mautic-password \
            --db_backup_tables=false --admin_firstname=Test --admin_lastname=Operator \
            --admin_username=ci_admin --admin_email=ci-admin@example.invalid --admin_password="$ADMIN_PASS"
      - name: Lint coordinator and acceptance harness
        run: |
          php -l packages/identity/bin/run_shadow_pipeline.php
          php -l packages/identity/tests/c4_08b_bounded_pipeline.php
          php -l packages/identity/bin/run_credentialed_shadow_cycle.php
          php -l packages/identity/src/Runtime/MosCredentialDirectory.php
          php -l packages/identity/tests/c4_07b3b3a_service.php
          php -l packages/identity/src/Runtime/MosDatabaseRestoreAttestor.php
          php -l packages/identity/tests/c4_07b3b3b2_full_sql_restore.php
      - name: Real Mautic committed source to Inbox coordinated SHADOW cycles
        run: php packages/identity/tests/c4_08b_bounded_pipeline.php
      - name: Credentialed service cycle including real Mautic Inbox, encrypted quarantine and refusal
        run: php packages/identity/tests/c4_07b3b3a_service.php
      - name: Install MariaDB client for actual SQL backup and import on disposable DB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-client
      - name: Take actual consistent SQL dump of installed Mautic and MOS state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export MYSQL_PWD=ci-only-root-password
          mariadb-dump --host=127.0.0.1 --port=3306 --user=root --single-transaction --quick --triggers mautic_ci > /tmp/mos-disposable-ci-backup.sql
          test -s /tmp/mos-disposable-ci-backup.sql
          sha256sum /tmp/mos-disposable-ci-backup.sql > /tmp/mos-disposable-ci-backup.sha256
          sha256sum -c /tmp/mos-disposable-ci-backup.sha256
          mariadb --host=127.0.0.1 --port=3306 --user=root -e "CREATE DATABASE mautic_restore_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mariadb --host=127.0.0.1 --port=3306 --user=root mautic_restore_ci < /tmp/mos-disposable-ci-backup.sql
      - name: Attest full source and restored SQL tables and archive cryptography
        env:
          MOS_CI_ALLOW_FULL_SQL_RESTORE: '1'
          MOS_CI_ROOT_PASSWORD: ci-only-root-password
        run: php packages/identity/tests/c4_07b3b3b2_full_sql_restore.php
      - name: Remove disposable SQL dump regardless of acceptance outcome
        if: always()
        run: |
          rm -f /tmp/mos-disposable-ci-backup.sql /tmp/mos-disposable-ci-backup.sha256
      - name: Confirm CI never enabled real marketing effects
        run: |
          test "$MOS_PIPELINE_ENABLED" = '0'
          test "$MOS_BRIDGE_MODE" = 'OFF'
          test "$MOS_QUEUE_MODE" = 'OFF'
