name: C4-07A Real Symfony Messenger Doctrine Queue
on:
  pull_request:
    paths:
      - 'packages/identity/src/Transport/**'
      - 'packages/identity/tests/c4_07_messenger_doctrine.php'
      - '.github/workflows/c4-07-messenger-doctrine.yml'
  push:
    branches: [main]
    paths:
      - 'packages/identity/src/Transport/**'
      - 'packages/identity/tests/c4_07_messenger_doctrine.php'
      - '.github/workflows/c4-07-messenger-doctrine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: mautic_ci
          MARIADB_USER: mautic_ci
          MARIADB_PASSWORD: ci-only-mautic-password
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      COMPOSER_MEMORY_LIMIT: "-1"
      MOS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mautic_ci;charset=utf8mb4
      MOS_TEST_DB_USER: mautic_ci
      MOS_TEST_DB_PASSWORD: ci-only-mautic-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, imap, intl, mbstring, mysqli, pdo_mysql, sodium, xml, zip
          ini-values: memory_limit=2G
          coverage: none
      - name: Composer locked dependencies
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction --no-ansi
      - name: Verify actual Messenger Doctrine transport is in lock
        run: |
          php -r '$lock=json_decode(file_get_contents("composer.lock"),true,512,JSON_THROW_ON_ERROR);$names=array_column($lock["packages"],"name");if(!in_array("symfony/doctrine-messenger",$names,true)||!in_array("symfony/messenger",$names,true))exit(1);'
      - name: PHP lint
        run: |
          find packages/identity/src/Transport -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l packages/identity/tests/c4_07_messenger_doctrine.php
      - name: Canonical contracts and domain regression
        run: |
          php packages/contracts/tests/run.php
          php packages/identity/tests/run.php
      - name: Actual durable Messenger Doctrine transport and Inbox test
        run: php packages/identity/tests/c4_07_messenger_doctrine.php
