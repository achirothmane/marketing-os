name: C4-08 Real Mautic Contact to Messenger Inbox
on:
  pull_request:
    paths:
      - 'packages/identity/tests/c4_08_**'
      - '.github/workflows/c4-08-source-to-inbox.yml'
      - 'packages/identity/src/**'
      - 'packages/identity/migrations/**'
      - 'composer.lock'
  push:
    branches: [main]
    paths:
      - 'packages/identity/tests/c4_08_**'
      - '.github/workflows/c4-08-source-to-inbox.yml'
      - 'packages/identity/src/**'
      - 'packages/identity/migrations/**'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-source-to-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: mautic_ci
          MARIADB_USER: mautic_ci
          MARIADB_PASSWORD: ci-only-mautic-password
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      COMPOSER_MEMORY_LIMIT: '-1'
      MOS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mautic_ci;charset=utf8mb4
      MOS_TEST_DB_USER: mautic_ci
      MOS_TEST_DB_PASSWORD: ci-only-mautic-password
      MOS_SNAPSHOT_HMAC_KEY: ci-only-hmac-secret-longer-than-32-bytes-not-production
      MOS_BRIDGE_MODE: SHADOW
      MOS_QUEUE_ENABLED: '0'
      MOS_QUEUE_MODE: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, imap, intl, mbstring, mysqli, pdo_mysql, sodium, xml, zip
          ini-values: memory_limit=2G, max_execution_time=600
          coverage: none
      - name: Install pinned Mautic runtime packages
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction --no-ansi
      - name: Install actual Mautic 7.2.1 into disposable MariaDB
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_PASS="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$ADMIN_PASS"
          php bin/console mautic:install 'http://127.0.0.1' --force --no-interaction \
            --db_driver=pdo_mysql --db_host=127.0.0.1 --db_port=3306 \
            --db_name=mautic_ci --db_user=mautic_ci --db_password=ci-only-mautic-password \
            --db_backup_tables=false --admin_firstname=Test --admin_lastname=Operator \
            --admin_username=ci_admin --admin_email=ci-admin@example.invalid --admin_password="$ADMIN_PASS"
      - name: Lint source to consumer acceptance harness
        run: |
          php -l packages/identity/tests/c4_08_real_source_to_inbox.php
          php -l packages/identity/tests/c4_08_crash_worker.php
      - name: Real Mautic source to Messenger and Inbox including hard-process exits
        run: php packages/identity/tests/c4_08_real_source_to_inbox.php
      - name: Verify no production/send gate toggles in CI
        run: |
          test "$MOS_QUEUE_ENABLED" = '0'
          test "$MOS_QUEUE_MODE" = 'OFF'
