name: C4-07B3B1 Read-only SHADOW Readiness
on:
  pull_request:
    paths:
      - 'packages/identity/**'
      - '.github/workflows/c4-07b3b1-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'packages/identity/**'
      - '.github/workflows/c4-07b3b1-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: mautic_ci
          MARIADB_USER: mautic_ci
          MARIADB_PASSWORD: ci-only-mautic-password
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      COMPOSER_MEMORY_LIMIT: '-1'
      MOS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=mautic_ci;charset=utf8mb4
      MOS_TEST_DB_USER: mautic_ci
      MOS_TEST_DB_PASSWORD: ci-only-mautic-password
      MOS_QUEUE_MODE: OFF
      MOS_BRIDGE_MODE: OFF
      MOS_PREFLIGHT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, intl, mbstring, mysqli, pdo_mysql, sodium, xml, zip
          coverage: none
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction --no-ansi
      - name: Lint preflight and base domain contracts
        run: |
          php -l packages/identity/src/Runtime/MosShadowReadinessPreflight.php
          php -l packages/identity/bin/shadow_readiness_preflight.php
          php -l packages/identity/tests/c4_07b3b_readiness.php
          php packages/contracts/tests/run.php
          php packages/identity/tests/run.php
      - name: Prove scoped read-only MariaDB operational preflight
        run: php packages/identity/tests/c4_07b3b_readiness.php
      - name: Keep operational switches disabled outside explicit test subprocesses
        run: |
          test "$MOS_PREFLIGHT_ENABLED" = '0'
          test "$MOS_QUEUE_MODE" = 'OFF'
