name: Canonical Contracts
on:
  push:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contracts-ci.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP contracts
        run: find packages/contracts/src packages/contracts/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test contracts
        run: php packages/contracts/tests/run.php
